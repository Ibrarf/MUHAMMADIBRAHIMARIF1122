<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" fill="none" role="img" aria-label="Muhammad Ibrahim Arif - AI and Automation Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#a855f7"/>
      <animate attributeName="x1" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.5;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="238" rx="14" fill="url(#bg)" stroke="url(#neon)" stroke-width="2"/>

  <!-- title bar -->
  <line x1="1" y1="44" x2="899" y2="44" stroke="#1f2937" stroke-width="1"/>
  <circle cx="28" cy="23" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="23" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="23" r="6" fill="#27c93f"/>
  <text x="450" y="28" text-anchor="middle" font-family="'Fira Code',monospace" font-size="13" fill="#6b7280">ibrahim@nysonian: ~/agents</text>

  <!-- prompt -->
  <text x="30" y="86" font-family="'Fira Code',monospace" font-size="16" fill="#22c55e">$ ./deploy_agent.sh --owner <tspan fill="#0ea5e9">ibrahim</tspan></text>

  <!-- big title -->
  <text x="30" y="140" font-family="'Fira Code','Courier New',monospace" font-size="40" font-weight="700" fill="url(#neon)" filter="url(#glow)">AI &amp; AUTOMATION</text>
  <text x="30" y="184" font-family="'Fira Code','Courier New',monospace" font-size="40" font-weight="700" fill="#e5e7eb">ENGINEER
    <tspan fill="#22c55e">
      <animate attributeName="fill-opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/> _
    </tspan>
  </text>

  <!-- status line -->
  <text x="30" y="216" font-family="'Fira Code',monospace" font-size="13" fill="#6b7280">
    <tspan fill="#22c55e">●</tspan> agents: online   <tspan fill="#0ea5e9">●</tspan> pipelines: running   <tspan fill="#a855f7">●</tspan> LLMs: connected
  </text>

  <!-- animated scan bar -->
  <rect x="30" y="150" width="360" height="2" fill="url(#neon)" opacity="0.35">
    <animate attributeName="width" values="0;360;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
